# PR агента: проверка → автослияние → выкладка (deploy-kit pr.yml + site.yml). Стандарт — «Публикация — стандарт» §4.
# Ветка claude/* с зелёным check сливается сама и сразу выкладывается этим же запуском:
# слияние токеном GITHUB_TOKEN не запускает deploy.yml. Метка needs-nik или правка .github/ и publish.json — ждёт Ника.
# Значения with: у job deploy — те же, что в deploy.yml (паспорт publish.json). При переезде на pro-nas.pro — менять в обоих файлах.
name: PR
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
concurrency: { group: "pr-${{ github.event.pull_request.number }}", cancel-in-progress: true }
jobs:
  pr:
    permissions: { contents: write, pull-requests: write }
    uses: nikalimp/deploy-kit/.github/workflows/pr.yml@v1
    with:
      site_dir: "."
      check_command: "SITE_URL=https://eco-pro.nikalimp.ru npm run check"
  deploy:
    needs: pr
    if: needs.pr.outputs.merged == 'true'
    concurrency: { group: deploy, cancel-in-progress: false }
    permissions: { contents: write }
    uses: nikalimp/deploy-kit/.github/workflows/site.yml@v1
    with:
      ref: main
      adapter: ssh-ftp
      site_dir: "."
      out_dir: out
      app_path: ""
      rsync_exclude: "api/config.php api/logs/"
      url: https://eco-pro.nikalimp.ru
      build_command: "SITE_URL=https://eco-pro.nikalimp.ru npm run check"
      media_brand: content/media/brand.json
    secrets: inherit
