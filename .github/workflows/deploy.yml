# Выкладка сайта — вызов общего сценария nikalimp/deploy-kit (стандарт «Публикация — стандарт»).
# Порядок: SSH (rsync) → если не прошёл, FTP → если упали оба, сборка в артефакте site-build и scripts/deploy-site.sh с Mac.
# Значения with: повторяют publish.json. Секреты (Settings → Secrets and variables → Actions):
#   FTP_HOST, FTP_USER, FTP_PASS, FTP_DIR (REG.RU — www/eco-pro.nikalimp.ru/) — основной путь: SSH из Actions на REG.RU закрыт
#   SSH_KEY, SSH_HOST, SSH_USER, SITE_DIR — необязательно
# api/config.php (токен бота, почта) в репозитории нет и выкладкой не трогается: rsync — исключение, FTP — заливает только своё.
name: Deploy
on:
  push:
    branches: [main]
    paths-ignore: ["specs/**", "*.md", "content/factory/**"]
  workflow_dispatch: {}
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  site:
    permissions: { contents: write }   # deploy-kit коммитит обратно картинки статей
    uses: nikalimp/deploy-kit/.github/workflows/site.yml@main
    with:
      adapter: ssh-ftp
      site_dir: "."
      out_dir: out
      app_path: ""
      rsync_exclude: "api/config.php api/logs/"
      url: https://eco-pro.nikalimp.ru
      build_command: "SITE_URL=https://eco-pro.nikalimp.ru npm run check"   # адрес сайта в canonical, sitemap, IndexNow; при переезде — вместе с url
    secrets: inherit
